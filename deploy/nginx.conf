# Replace example.com with your domain, then copy to:
#   /etc/nginx/sites-available/castleforever
# and symlink into /etc/nginx/sites-enabled/.
#
# Run certbot afterwards: sudo certbot --nginx -d example.com -d www.example.com
# Certbot will add the TLS server block and redirect for you.

upstream castleforever {
    server unix:/run/castleforever/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 25M;

    # Static files collected by `manage.py collectstatic`.
    location /static/ {
        alias /srv/castleforever/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Only needed when USE_S3_MEDIA=0 (local media storage).
    # With a bucket, media URLs point at the bucket/CDN and never reach Nginx.
    location /media/ {
        alias /srv/castleforever/media/;
        access_log off;
        expires 7d;
    }

    # Internal readiness probe (Django checks the database).
    location = /healthz/ {
        proxy_pass http://castleforever;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location / {
        proxy_pass http://castleforever;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
