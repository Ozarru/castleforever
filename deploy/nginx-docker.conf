# Host Nginx reverse proxy for the Docker Compose deployments.
#
#   stage -> 127.0.0.1:8001 (APP_PORT in .env.stage)
#   prod  -> 127.0.0.1:8000 (APP_PORT in .env.prod)
#
# If stage and prod run on different servers, keep only the matching block.
# Install as /etc/nginx/sites-available/castleforever-docker and symlink it,
# then run certbot for each domain:
#   sudo certbot --nginx -d stage.castleforever.com
#   sudo certbot --nginx -d castleforever.com -d www.castleforever.com
#
# Static files are served by WhiteNoise inside the container, so everything is
# proxied to Gunicorn. Uploaded media is served by the S3-compatible bucket.

upstream castleforever_stage {
    server 127.0.0.1:8001;
    keepalive 16;
}

upstream castleforever_prod {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.castleforever.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://castleforever_stage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name castleforever.com www.castleforever.com;

    client_max_body_size 25M;

    location / {
        proxy_pass http://castleforever_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
