{% extends "core/dashboard_layout.html" %}
{% load i18n %}
{% block title %}{% trans "Delete" %} | Dashboard{% endblock %}
{% block content %}
<main class="w-full max-w-4xl mx-auto px-6 py-16">
  <h1 class="font-display text-5xl">{% trans "Delete record?" %}</h1>
  <p class="text-gray-600 mt-5">{{ object }}</p>
  <form method="post" class="mt-8">
    {% csrf_token %}
    <button class="bg-red-700 text-white py-4 px-8 uppercase tracking-widest text-xs">{% trans "Delete" %}</button>
    <a href="javascript:history.back()" class="ml-4 text-gray-600">{% trans "Cancel" %}</a>
  </form>
</main>
{% endblock %}
