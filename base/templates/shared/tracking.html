{% load i18n %}{% comment %}Optional analytics/Ads hooks. All IDs come from settings/env; no tracking is emitted by default.{% endcomment %}
{% if GOOGLE_TAG_MANAGER_ID %}
  <script>
    (function (w, d, s, l, i) {
      w[l] = w[l] || [];
      w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
      var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s),
        dl = l != "dataLayer" ? "&l=" + l : "";
      j.async = true;
      j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
      f.parentNode.insertBefore(j, f);
    })(window, document, "script", "dataLayer", "{{ GOOGLE_TAG_MANAGER_ID }}");
  </script>
{% endif %}

{% if primary_tracking_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ primary_tracking_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { window.dataLayer.push(arguments); }
    gtag("js", new Date());
    {% if GOOGLE_ANALYTICS_ID %}gtag("config", "{{ GOOGLE_ANALYTICS_ID }}");{% endif %}
    {% if GOOGLE_ADS_ID %}gtag("config", "{{ GOOGLE_ADS_ID }}");{% endif %}
  </script>
{% endif %}

{% if GOOGLE_ADS_ID and GOOGLE_ADS_CONVERSION_LABEL %}
  <script>
    window.castleForeverConversion = function () {
      if (typeof gtag === "function") {
        gtag("event", "conversion", {
          send_to: "{{ GOOGLE_ADS_ID }}/{{ GOOGLE_ADS_CONVERSION_LABEL }}"
        });
      }
    };
    document.addEventListener("submit", function (event) {
      if (event.target instanceof HTMLFormElement && event.target.hasAttribute("data-ads-conversion")) {
        window.castleForeverConversion();
      }
    });
  </script>
{% endif %}
