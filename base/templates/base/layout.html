{% load static i18n %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}CastleForever{% endblock %}</title>

    <meta name="description" content="{% block meta_description %}CastleForever: discover exceptional estates, exclusive services and unique experiences to celebrate your wedding.{% endblock %}" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'styles.css' %}" />

    <link
      rel="shortcut icon"
      href="{% static 'images/brand/favicon.ico' %}"
      type="image/x-icon"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              cream: "#F8F6F0",
              forest: "#243B32",
              gold: "#A58A5A",
              ink: "rgb(var(--cf-ink) / <alpha-value>)",
            },
            fontFamily: {
              display: ["Italiana", "serif"],
              sans: ["DM Sans", "sans-serif"],
            },
          },
        },
      };
    </script>

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="min-h-screen flex flex-col font-sans text-ink">

    <!-- HEADER -->

    {% include "shared/navbar.html" %}
    
    <!-- NOTIFICATION MESSAGES -->

    {% if messages %}

      <div class="max-w-7xl mx-auto px-6 py-4">

        {% for message in messages %}

          <p class="text-sm">
            {{ message }}
          </p>

        {% endfor %}

      </div>

    {% endif %}

    <!-- MAIN CONTENT -->

    <div class="flex-1">
      {% block content %}{% endblock %}
    </div>

    <!-- FOOTER -->

    {% include "shared/footer.html" %}

  </body>
</html>
