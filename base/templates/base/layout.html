{% load static i18n %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{% block title %}CastleForever{% endblock %}</title>

    <meta name="description" content="CastleForever: discover exceptional estates, exclusive services and unique experiences to celebrate your wedding." />

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italiana&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              cream: "#F8F6F0",
              forest: "#243B32",
              gold: "#A58A5A",
              ink: "#222822",
            },
            fontFamily: {
              display: ["Italiana", "serif"],
              sans: ["DM Sans", "sans-serif"],
            },
          },
        },
      };
    </script>

    <style>
      html.dark body {
        background: #0f172a;
        color: #e5e7eb;
      }

      html.dark .bg-white {
        background-color: #1e293b !important;
      }

      html.dark .bg-\[\#f8f6f0\] {
        background-color: #0f172a !important;
      }

      html.dark .text-\[\#222\] {
        color: #e5e7eb !important;
      }

      html.dark .text-gray-600,
      html.dark .text-gray-500 {
        color: #9ca3af !important;
      }

      html.dark header {
        background-color: #111827;
        border-color: #374151;
      }

      html.dark .border-gray-200 {
        border-color: #374151 !important;
      }
    </style>

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body class="min-h-screen flex flex-col font-sans text-[#222] bg-[#f8f6f0]">

    <!-- HEADER -->

    {% include "shared/navbar.html" %}
    
    <!-- NOTIFICATION MESSAGES -->

    {% if messages %}

      <div class="max-w-7xl mx-auto px-6 py-4">

        {% for message in messages %}

          <p class="text-sm">
            {{ message }}
          </p>

        {% endfor %}

      </div>

    {% endif %}

    <!-- MAIN CONTENT -->

    <div class="flex-1">
      {% block content %}{% endblock %}
    </div>

    <!-- FOOTER -->

    {% include "shared/footer.html" %}

  </body>
</html>
